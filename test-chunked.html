<!DOCTYPE html>
<html>
<head>
    <title>Test Chunked Upload</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        .progress { width: 100%; height: 20px; background: #f0f0f0; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: #007bff; transition: width 0.3s; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Chunked Upload Test</h1>
    <input type="file" id="fileInput" accept=".json">
    <input type="text" id="sourceName" placeholder="Source name (optional)" style="width: 100%; margin: 10px 0; padding: 8px;">
    <button onclick="uploadFile()" id="uploadBtn">Upload File</button>
    
    <div id="status"></div>
    <div class="progress" style="display: none;" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="stage"></div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const sourceNameInput = document.getElementById('sourceName');
            const uploadBtn = document.getElementById('uploadBtn');
            const statusDiv = document.getElementById('status');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const stageDiv = document.getElementById('stage');
            
            if (!fileInput.files[0]) {
                alert('Please select a file');
                return;
            }
            
            const file = fileInput.files[0];
            const sourceName = sourceNameInput.value || 'Test Import';
            
            uploadBtn.disabled = true;
            statusDiv.innerHTML = '';
            progressContainer.style.display = 'block';
            stageDiv.textContent = 'Reading file...';
            
            try {
                const content = await file.text();
                const conversations = JSON.parse(content);
                
                if (!Array.isArray(conversations)) {
                    throw new Error('Invalid file format - expected array of conversations');
                }

                const totalConversations = conversations.length;
                let processedCount = 0;
                let sourceId = null;

                stageDiv.textContent = `Uploading ${totalConversations} conversations in batches...`;

                // Send conversations in chunks
                const chunkSize = 50; // 50 conversations per chunk
                for (let i = 0; i < conversations.length; i += chunkSize) {
                    const chunk = conversations.slice(i, i + chunkSize);
                    const chunkIndex = Math.floor(i / chunkSize) + 1;
                    const totalChunks = Math.ceil(conversations.length / chunkSize);
                    
                    stageDiv.textContent = `Uploading batch ${chunkIndex}/${totalChunks} (${chunk.length} conversations)...`;
                    progressBar.style.width = `${(processedCount / totalConversations) * 100}%`;

                    const response = await fetch('/api/import/chatgpt', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            conversations: chunk,
                            sourceName: i === 0 ? sourceName : undefined, // Only set name for first chunk
                            sourceId, // Reuse same source for subsequent chunks
                        }),
                    });

                    const result = await response.json();
                    
                    if (!result.success) {
                        throw new Error(result.error || 'Upload failed');
                    }

                    // Store sourceId from first chunk
                    if (i === 0) {
                        sourceId = result.data?.sourceId;
                    }

                    processedCount += chunk.length;
                    progressBar.style.width = `${(processedCount / totalConversations) * 100}%`;
                }

                stageDiv.textContent = 'Upload complete!';
                statusDiv.innerHTML = `<div class="success">✅ Successfully uploaded ${processedCount} conversations!</div>`;

            } catch (error) {
                console.error('Chunked upload error:', error);
                statusDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
            } finally {
                uploadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
